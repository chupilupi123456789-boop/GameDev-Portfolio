<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f2a"/>
      <stop offset="55%" stop-color="#1b1140"/>
      <stop offset="100%" stop-color="#2a0f4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7CFFB2"/>
      <stop offset="50%" stop-color="#6ec6ff"/>
      <stop offset="100%" stop-color="#ff6ec7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6ec6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6ec6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <circle cx="1000" cy="70" r="180" fill="url(#glow)"/>
  <circle cx="150" cy="220" r="160" fill="url(#glow)"/>

  <g fill="#ffffff" opacity="0.14">
    <rect x="60" y="40" width="6" height="6"/>
    <rect x="80" y="40" width="6" height="6"/>
    <rect x="60" y="60" width="6" height="6"/>
    <rect x="1120" y="200" width="6" height="6"/>
    <rect x="1140" y="200" width="6" height="6"/>
    <rect x="1140" y="220" width="6" height="6"/>
  </g>

  <g transform="translate(90,95)">
    <rect x="0" y="20" width="150" height="60" rx="30" fill="#151238" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="35" cy="50" r="9" fill="none" stroke="#7CFFB2" stroke-width="4"/>
    <rect x="27" y="46" width="16" height="8" fill="none"/>
    <line x1="35" y1="41" x2="35" y2="59" stroke="#7CFFB2" stroke-width="4" stroke-linecap="round"/>
    <line x1="26" y1="50" x2="44" y2="50" stroke="#7CFFB2" stroke-width="4" stroke-linecap="round"/>
    <circle cx="105" cy="42" r="6" fill="#ff6ec7"/>
    <circle cx="122" cy="55" r="6" fill="#6ec6ff"/>
    <circle cx="105" cy="66" r="6" fill="#ffd166"/>
    <circle cx="88" cy="55" r="6" fill="#7CFFB2"/>
  </g>

  <text x="280" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">
    Saul Santiago Gutierrez Villacorta
  </text>
  <text x="280" y="162" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="url(#accent)">
    Game Development Portfolio
  </text>
  <text x="280" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#b9b6d0">
    Prototipos y videojuegos creados en HTML5, CSS3 y JavaScript — jugables desde el navegador
  </text>

  <rect x="280" y="212" width="640" height="3" fill="url(#accent)" opacity="0.8"/>
</svg>
